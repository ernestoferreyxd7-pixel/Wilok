
name: Build Dedsafio Fabric 1.21.1

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          mkdir -p extracted

          if [ -f dedsafio3-bosses-fabric-fixes1.zip ]; then
            ZIP_FILE="dedsafio3-bosses-fabric-fixes1.zip"
          elif [ -f dedsafio3-bosses-fabric-github.zip ]; then
            ZIP_FILE="dedsafio3-bosses-fabric-github.zip"
          else
            ZIP_FILE="$(find . -maxdepth 1 -name '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró el ZIP"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          BUILD_FILE="$(find extracted -name build.gradle -type f -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No se encontró build.gradle"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Dedsafio-Fabric-1.21.1
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          
